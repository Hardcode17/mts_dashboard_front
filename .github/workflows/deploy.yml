name: Check frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    env:
      VITE_BACKEND_MODE: real
      VITE_OIDC_AUTHORITY: https://example.invalid/keycloak/realms/dashboard
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node tests/e2e/assert-live-bundle.mjs
