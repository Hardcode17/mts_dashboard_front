name: Check frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    env:
      VITE_BACKEND_MODE: real
      VITE_OIDC_AUTHORITY: https://example.invalid/keycloak/realms/dashboard
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node tests/e2e/assert-live-bundle.mjs

  request-stand-deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Hardcode17/mts_dashboard_front'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Trigger Deploy backend on main
        env:
          STAND_DEPLOY_TOKEN: ${{ secrets.STAND_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$STAND_DEPLOY_TOKEN" ]]; then
            echo '::warning::Set STAND_DEPLOY_TOKEN to enable automatic stand deployment.'
            exit 0
          fi
          curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $STAND_DEPLOY_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            'https://api.github.com/repos/Hardcode17/mts_dashboard_backend/actions/workflows/deploy.yml/dispatches'
