name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, pi-web]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: mts-dashboard-front
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '8080' }}
      MCC_KEYCLOAK_URL: ${{ vars.MCC_KEYCLOAK_URL || 'http://localhost:8084' }}
      MCC_AUTH_ME_URL: ${{ vars.MCC_AUTH_ME_URL || 'http://host.docker.internal:8091/api/me' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Docker
        run: |
          docker info
          docker compose version
          docker compose config --quiet

      - name: Build and validate frontend
        run: docker compose build --pull frontend

      - name: Deploy and wait for healthcheck
        run: docker compose up -d --no-build --wait --wait-timeout 120 frontend

      - name: Verify deployed revision and published frontend
        run: |
          container_id=$(docker compose ps -q frontend)
          image_id=$(docker inspect --format '{{.Image}}' "$container_id")
          revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")
          test "$revision" = "$GITHUB_SHA"
          echo "Running image revision: $revision"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import urlopen

          origin = "http://127.0.0.1:" + os.environ["FRONTEND_PORT"]

          def fetch(path):
              with urlopen(origin + path, timeout=10) as response:
                  return response.read()

          def check_asset(path, filename):
              expected = subprocess.check_output(["docker", "compose", "exec", "-T", "frontend", "cat", filename])
              received = fetch(path)
              if received != expected:
                  raise SystemExit(f"Unexpected content at {path}")
              return received

          html = check_asset("/", "dist/index.html").decode()
          bundle = re.search(r'<script\b[^>]*\bsrc="(/assets/[\w.-]+\.js)"', html)
          if not bundle:
              raise SystemExit("Frontend entry bundle missing")
          check_asset(bundle[1], "dist" + bundle[1])
          try:
              fetch("/api/stand/snapshot?mode=case")
          except HTTPError as error:
              if error.code != 401 or not error.headers.get("WWW-Authenticate", "").startswith("Bearer"):
                  raise
          else:
              raise SystemExit("Workspace API accepted an anonymous request")
          print(f"Published HTML and {bundle[1]} match the running image; anonymous workspace API returned 401")
          PY

      - name: Verify Keycloak login and the published workspace in Chromium
        env:
          MCC_PUBLIC_ORIGIN: ${{ vars.MCC_PUBLIC_ORIGIN }}
          MCC_SMOKE_USERNAME: ${{ secrets.MCC_SMOKE_USERNAME }}
          MCC_SMOKE_PASSWORD: ${{ secrets.MCC_SMOKE_PASSWORD }}
        timeout-minutes: 10
        run: |
          docker build --target stand-browser --tag mts-dashboard-front-stand-browser .
          docker run --rm --network host --shm-size=256m --env FRONTEND_PORT --env MCC_PUBLIC_ORIGIN --env MCC_KEYCLOAK_URL --env MCC_SMOKE_USERNAME --env MCC_SMOKE_PASSWORD mts-dashboard-front-stand-browser

      - name: Show deployment status
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 100 frontend
