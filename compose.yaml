services:
  frontend:
    build:
      context: .
      args:
        VITE_KEYCLOAK_URL: "${VITE_KEYCLOAK_URL:-}"
        VITE_KEYCLOAK_REALM: "${VITE_KEYCLOAK_REALM:-}"
        VITE_KEYCLOAK_CLIENT_ID: "${VITE_KEYCLOAK_CLIENT_ID:-}"
      labels:
        org.opencontainers.image.revision: "${GITHUB_SHA:-local}"
    environment:
      MCC_BACKEND_ORIGIN: "${MCC_BACKEND_ORIGIN:-}"
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    restart: unless-stopped
    volumes:
      - mcc-stand:/app/.mcc-stand
      - ./mock/fixtures:/app/mock/fixtures:ro
volumes:
  mcc-stand:
